plugins {
    id "com.android.application"
}

android {
    namespace "app.zen.launcher"
    compileSdk 35

    defaultConfig {
        applicationId "app.zen.launcher"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/zen-release.jks")
            storePassword "zenlauncher"
            keyAlias "zen"
            keyPassword "zenlauncher"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin" && details.requested.name.startsWith("kotlin-stdlib")) {
            details.useVersion "1.8.22"
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.activity:activity:1.9.3"
}
